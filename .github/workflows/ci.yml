name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

# PR runs cancel on a new push: only checks run there, so an abort is free and
# saves a CI slot. `main` runs serialize instead (cancel-in-progress: false),
# because every main push deploys and cancelling an in-flight run could abort a
# Zerops deploy mid-push. Queuing lets the newest run land last, on the complete
# tree, with no overtaking between back-to-back merges.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job starts with checkout-only repository access. The one job-level
# block below raises it solely for the Actions metadata lookup that resolves
# the last successful run.
permissions:
  contents: read

jobs:
  detect-validation-changes:
    name: Detect Validation Changes
    runs-on: ubuntu-latest
    if: always()
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      developer: ${{ steps.filter.outputs.developer }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      dashboard_ui: ${{ steps.filter.outputs.dashboard_ui }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Detect affected workspaces
        id: filter
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        # The workspace graph decides what a change affects, see
        # scripts/changed-workspaces.mjs. A pull request compares against its
        # base, a push against the commit before it.
        run: |
          set -euo pipefail
          node scripts/changed-workspaces.mjs validate "${PULL_REQUEST_BASE_SHA:-$PUSH_BEFORE_SHA}" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable pnpm
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Validate affected workspaces
    runs-on: ubuntu-latest
    needs: detect-validation-changes
    # The backend's integration tests run against a database that exists for
    # this job alone, so they can write and delete rows without reaching
    # anything shared. postgres:18 is the version the local `musiccloud`
    # container runs. Trust authentication keeps a password out of the file;
    # the port is reachable from this runner only.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: musiccloud
          POSTGRES_DB: musiccloud_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musiccloud -d musiccloud_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://musiccloud@localhost:5432/musiccloud_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: corepack enable pnpm
      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Build shared package
        if: needs.detect-validation-changes.outputs.shared == 'true'
        run: pnpm --filter @musiccloud/shared build
      - name: Shared
        if: needs.detect-validation-changes.outputs.shared == 'true'
        run: pnpm exec tsc --noEmit --project packages/shared/tsconfig.json
      - name: Backend
        if: needs.detect-validation-changes.outputs.backend == 'true'
        run: pnpm exec tsc --noEmit --project apps/backend/tsconfig.json
      - name: Frontend
        if: needs.detect-validation-changes.outputs.frontend == 'true'
        run: pnpm --filter @musiccloud/frontend check
      - name: Generate developer API reference
        if: needs.detect-validation-changes.outputs.developer == 'true'
        run: pnpm --filter @musiccloud/developer run prebuild
      - name: Developer
        if: needs.detect-validation-changes.outputs.developer == 'true'
        run: pnpm --filter @musiccloud/developer typecheck
      - name: Dashboard UI
        if: needs.detect-validation-changes.outputs.dashboard_ui == 'true'
        run: pnpm --filter @musiccloud/dashboard-ui typecheck
      - name: Dashboard
        if: needs.detect-validation-changes.outputs.dashboard == 'true'
        run: pnpm --filter @musiccloud/dashboard typecheck
      - name: Workflow and deployment contracts
        run: node --test scripts/*.test.mjs
      - name: Shared tests
        if: needs.detect-validation-changes.outputs.shared == 'true'
        run: pnpm --filter @musiccloud/shared test:run
      # The migration runner reads DATABASE_URL, so it gets the integration
      # database for this one step. The tests themselves read only
      # TEST_DATABASE_URL.
      - name: Migrate the integration database
        if: needs.detect-validation-changes.outputs.backend == 'true'
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm db:migrate
      - name: Backend tests
        if: needs.detect-validation-changes.outputs.backend == 'true'
        run: pnpm --filter @musiccloud/backend test:run
      - name: Frontend tests
        if: needs.detect-validation-changes.outputs.frontend == 'true'
        run: pnpm --filter @musiccloud/frontend test:run
      - name: Developer tests
        if: needs.detect-validation-changes.outputs.developer == 'true'
        run: pnpm --filter @musiccloud/developer test:run
      - name: Dashboard tests
        if: needs.detect-validation-changes.outputs.dashboard == 'true'
        run: pnpm --filter @musiccloud/dashboard test:run

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: github.event_name == 'push'
    # `contents: read` for the checkout, `actions: read` so `gh run list` can
    # look up the last successful run of this workflow (the diff base below).
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      developer: ${{ steps.filter.outputs.developer }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Detect services to deploy
        id: filter
        shell: bash
        env:
          # Passed through env (not inlined into the script) so these run-context
          # values cannot break out of the shell. Both are commit SHAs.
          HEAD_SHA: ${{ github.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          head_sha="$HEAD_SHA"

          # Diff base is the head SHA of the last SUCCESSFUL push run of this
          # workflow on main, not github.event.before. A push that fails before its deploy
          # jobs (e.g. at lint) must not "consume" its file changes: with
          # github.event.before the next green push would diff only against the
          # failed push and never re-evaluate the stranded paths, silently
          # skipping that service's deploy. Anchoring to the last green run
          # re-includes everything changed since the last real deploy, so a
          # lint-fix follow-up still deploys whatever the failed push touched.
          before_sha=$(gh run list \
            --workflow ci.yml \
            --branch main \
            --event push \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // empty' 2>/dev/null || true)

          # Fall back to the push's own before-ref if the lookup yields nothing
          # (e.g. no prior successful run, or the API call failed). A base the
          # checkout does not know means the whole tree, see
          # scripts/changed-workspaces.mjs.
          node scripts/changed-workspaces.mjs deploy "${before_sha:-$PUSH_BEFORE_SHA}" "$head_sha" >> "$GITHUB_OUTPUT"

  # Each deploy job calls .github/workflows/deploy-service.yml with the values
  # that differ between the services. The called workflow keeps `contents:
  # read` and takes the deploy secrets from here.
  deploy-backend:
    name: Deploy Backend
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    uses: ./.github/workflows/deploy-service.yml
    secrets: inherit
    with:
      app: backend
      service-name: Backend
      host: api.musiccloud.io
      # The backend's runtime health boundary, so a crash during startup fails
      # the deployment.
      probe-paths: /health/backend
      zerops-service-id: vftiwXaYQGCnnwEEaiGPYA

  deploy-frontend:
    name: Deploy Frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    uses: ./.github/workflows/deploy-service.yml
    secrets: inherit
    with:
      app: frontend
      service-name: Frontend
      host: musiccloud.io
      probe-paths: /
      zerops-service-id: bMY4g66BRDOfq1AAi8Q85A

  deploy-developer:
    name: Deploy Developer
    needs: detect-changes
    if: needs.detect-changes.outputs.developer == 'true'
    uses: ./.github/workflows/deploy-service.yml
    secrets: inherit
    with:
      app: developer
      service-name: Developer Site
      host: developer.musiccloud.io
      probe-paths: /
      zerops-service-id: snJHAWsxR32xetGASY33cQ

  deploy-dashboard:
    name: Deploy Dashboard
    # nginx resolves the `backend` upstream once, when it loads its config, and
    # keeps the result. Once the backend container is replaced, the dashboard
    # answers every /api/ request with 502 or a timeout until it restarts. So
    # the dashboard deploys again after every successful backend deploy, even
    # when only the backend changed, and it waits for the backend job, which
    # ends with its own health probe, so the new container resolves the new
    # backend. A skipped backend still lets a dashboard change deploy, and a
    # failed one skips the dashboard.
    needs: [detect-changes, deploy-backend]
    if: always() && (needs.deploy-backend.result == 'success' || (needs.deploy-backend.result == 'skipped' && needs.detect-changes.outputs.dashboard == 'true'))
    uses: ./.github/workflows/deploy-service.yml
    secrets: inherit
    with:
      app: dashboard
      service-name: Dashboard
      host: dashboard.musiccloud.io
      # The page comes from disk. setup-status goes through the proxy to the
      # backend, so a stale upstream fails the deployment instead of passing.
      probe-paths: / /api/admin/auth/setup-status
      zerops-service-id: IF9Xp4YFRxuQKRQxmAWFBA
