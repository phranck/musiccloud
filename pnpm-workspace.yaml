packages:
  - "apps/*"
  - "packages/*"

# Holds the optional `@types/node` peer of Vite and Astro, in workspaces that
# declare none, to the Node major `.nvmrc` pins. pnpm 10 reads overrides here
# and ignores them in package.json. scripts/node-version.test.mjs checks both.
overrides:
  "@types/node": "^22.20.5"
